# Copy these blocks into ~/.config/yazi/yazi.toml
# Requires: ya pkg add yazi-rs/plugins:piper
#
# Yazi 26 openers use %s (not "$@").
# $w is the preview pane width (piper env).

[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- mdterm preview "$1" --width $w'

[[plugin.prepend_previewers]]
mime = "text/markdown"
run = 'piper -- mdterm preview "$1" --width $w'

[opener]
mdterm = [
  { run = 'mdterm pager %s', desc = "Markdown (mdterm)", block = true, for = "unix" },
]

[open]
prepend_rules = [
  { url = "*.md", use = [ "mdterm", "edit" ] },
  { mime = "text/markdown", use = [ "mdterm", "edit" ] },
]
